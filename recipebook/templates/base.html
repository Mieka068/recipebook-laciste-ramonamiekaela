<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book | {% block title %}{% endblock %}</title>

    <!-- Embedded CSS -->
    <style>
        body {
            font-family: "Century Gothic", "Segoe UI", sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }

        /* Header Styling */
        header {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
        }

        /* Layout Container */
        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Links */
        a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: #0056b3;
        }

        /* Buttons */
        button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #c82333;
        }

        /* List Styling */
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background: #f1f1f1;
            margin: 8px 0;
            padding: 10px;
            border-radius: 5px;
        }

        /* Page Title */
        h2 {
            text-align: center;
            font-weight: bold;
        }

        /* Form Styling */
        form {
            text-align: center;
        }

        form button {
            background-color: #007bff;
        }

        form button:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>Recipe Book</h1>
        {% if user.is_authenticated %}
            <form method="post" action="{% url 'logout' %}" style="display: inline;">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </header>

    <!-- Main Container -->
    <div class="container">
        <h2>{% block page_title %}{% endblock %}</h2>
        {% block content %}{% endblock %}
    </div>

</body>
</html>
