<!DOCTYPE html>
<html>
<head>
    <title>Recipe Book</title>
</head>
<body>
    <h1>Recipe Book</h1>
    <h2>{{ recipe.name }}</h2>
    <ul>
        {% for ingredient in recipe.ingredients.all %}
            <li>{{ ingredient.ingredient.name }} - {{ ingredient.quantity }}</li>
        {% empty %}
            <li>No ingredients listed.</li>
        {% endfor %}
    </ul>
    <a href="{% url 'ledger:recipe_list' %}">Back to Recipes</a>
</body>
</html>
