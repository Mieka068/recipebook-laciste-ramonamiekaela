{% extends "base.html" %}

{% block title %}Upload Image{% endblock %}
{% block page_title %}Upload Image for {{ recipe.name }}{% endblock %}

{% block content %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Upload</button>
    </form>

    <a href="{{ recipe.get_absolute_url }}" class="btn">Back to Recipe</a>
{% endblock %}
